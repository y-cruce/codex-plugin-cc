name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run test suite
        run: npm test

      - name: Run build
        run: npm run build

      # What users install is `plugins/codex`, and Claude Code runs `npm ci`
      # there, not at the repository root: a lockfile that is broken only in
      # the shipped manifest fails nowhere else.
      - name: Install the plugin's own dependencies
        working-directory: plugins/codex
        run: npm ci --ignore-scripts

      - name: Load the ACP driver the way an installed plugin does
        working-directory: plugins/codex
        run: node -e "import('./scripts/lib/executors/acp-driver.mjs').then(m => { if (!m.openAcpExecutorJob) throw new Error('driver export missing') })"
